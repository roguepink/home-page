<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>GRIT TRAIL</title>
<style>
/* One-screen game: a 1280x720 (wider on wide phones) stage scaled to fit, on a dark ground. Single dark look. */
:root{
  color-scheme:dark;
  --bg:#0d0f11; --ink:#f4f1ea; --dim:rgba(244,241,234,.62); --acc:#ff7a1a; --acc2:#ffb347; --ok:#5fd16b; --bad:#ff4a3d;
  --panel:rgba(14,16,18,.62); --line:rgba(255,255,255,.16);
  --font:"Helvetica Neue","Arial","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{position:relative;font-family:var(--font);font-weight:700;color:var(--ink)}
#wrap{position:absolute;left:env(safe-area-inset-left,0px);top:0;right:env(safe-area-inset-right,0px);bottom:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:var(--sw,1280px);height:720px;transform-origin:0 0;overflow:hidden;background:#8fa9b8;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
#gl{position:absolute;left:0;top:0;width:var(--sw,1280px);height:720px;display:block}
.layer{position:absolute;left:0;top:0;width:var(--sw,1280px);height:720px;pointer-events:none}
.sh{text-shadow:0 2px 6px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6)}
.num{font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* ---- HUD ---- */
#hud{opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
#stageTag{position:absolute;left:28px;top:22px;padding:10px 18px 10px 16px;background:var(--panel);border-left:5px solid var(--acc);backdrop-filter:blur(3px)}
#stageTag .k{font-size:15px;letter-spacing:.24em;color:var(--acc2)}
#stageTag .n{font-size:22px;margin-top:2px}
#posBox{position:absolute;left:28px;top:124px;display:flex;align-items:flex-end;gap:6px;line-height:.86}
#posNum{font-size:96px}
#posOf{font-size:34px;margin-bottom:8px;color:var(--dim)}
#posLbl{position:absolute;left:4px;top:-18px;font-size:14px;letter-spacing:.3em;color:var(--dim)}
#posBox.p1 #posNum,#posBox.p2 #posNum{color:#fff}
#posBox.out #posNum{color:#ffc9c2}
#posBox.bump{animation:bump .45s}
@keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#qual{position:absolute;left:30px;top:228px;font-size:15px;padding:4px 10px;background:var(--panel);border-radius:3px;letter-spacing:.06em}
#qual.ok{color:var(--ok)} #qual.ng{color:#ffb0a6}
#board{position:absolute;left:28px;top:266px;width:250px}
.brow{display:flex;align-items:center;gap:8px;height:27px;margin-bottom:3px;padding:0 10px 0 0;background:var(--panel);font-size:15px;transition:transform .3s}
.brow b{width:28px;text-align:center;background:rgba(255,255,255,.1);height:100%;display:flex;align-items:center;justify-content:center}
.brow .sw{width:6px;height:17px;flex:none}
.brow .nm{flex:1;white-space:nowrap;overflow:hidden}
.brow .gp{font-size:13px;color:var(--dim)}
.brow.me{background:rgba(255,122,26,.85);color:#fff}
.brow.me .gp{color:#fff}
.brow.cut{border-bottom:2px solid var(--acc2)}
#prog{position:absolute;left:calc(var(--sw,1280px)/2 - 300px);top:26px;width:600px;height:40px}
#progBar{position:absolute;left:0;right:0;top:16px;height:6px;background:rgba(255,255,255,.22);border-radius:3px}
#progFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);border-radius:3px}
#progFlag{position:absolute;right:-12px;top:6px;width:22px;height:22px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/11px 11px;border:2px solid #fff}
.pdot{position:absolute;top:12px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid #fff;transition:left .1s linear}
.pdot.me{width:20px;height:20px;top:9px;margin-left:-10px;border-width:3px;z-index:2}
#progTxt{position:absolute;left:0;right:0;top:-6px;text-align:center;font-size:15px;color:var(--dim);letter-spacing:.06em}
#timer{position:absolute;right:30px;top:22px;text-align:right}
#timer .k{font-size:14px;letter-spacing:.3em;color:var(--dim)}
#timeTxt{font-size:38px;line-height:1}
#speedBox{position:absolute;right:30px;bottom:24px;text-align:right;line-height:.9}
#speedNum{font-size:92px}
#speedUnit{font-size:24px;margin-left:6px;color:var(--dim);font-style:italic}
#rpm{width:260px;height:10px;margin:10px 0 0 auto;background:rgba(255,255,255,.18);overflow:hidden;transform:skewX(-20deg)}
#rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff,#ffcf6a 70%,#ff5a2a);transition:width .06s}
#surfTxt{margin-top:8px;font-size:16px;color:var(--dim);letter-spacing:.08em;height:20px}
#msg{position:absolute;left:0;top:186px;width:var(--sw,1280px);text-align:center}
#msg .m{display:block;font-size:52px;font-style:italic;animation:mpop 1.4s both;margin-bottom:2px}
#msg .m.s{font-size:30px}
#msg .m.good{color:#ffe08a} #msg .m.bad{color:#ff8b7c}
@keyframes mpop{0%{transform:translateX(-40px) skewX(-12deg);opacity:0}12%{transform:none;opacity:1}78%{opacity:1}100%{transform:translateX(30px);opacity:0}}
#count{position:absolute;left:0;top:190px;width:var(--sw,1280px);text-align:center;font-size:220px;line-height:1;font-style:italic}
#count .c{display:inline-block;animation:cpop .95s both}
#count .c.go{color:var(--acc)}
@keyframes cpop{0%{transform:scale(1.8);opacity:0}22%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.85);opacity:0}}
#wrong{position:absolute;left:0;top:300px;width:var(--sw,1280px);text-align:center;font-size:56px;color:var(--bad);display:none;animation:blink .5s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.3}}
#vig{background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 58%, rgba(0,0,0,.42) 100%)}
#flash{background:#fff;opacity:0}
#letter{opacity:0;transition:opacity .5s}
#letter.on{opacity:1}
#letter:before,#letter:after{content:"";position:absolute;left:0;right:0;height:64px;background:#000}
#letter:before{top:0} #letter:after{bottom:0}
/* ---- title ---- */
#title{transition:opacity .4s}
#title.off{opacity:0}
#tShade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,10,.78) 0%,rgba(8,9,10,.35) 46%,rgba(8,9,10,0) 70%)}
#logoWrap{position:absolute;left:80px;top:120px}
#logoSub{font-size:18px;letter-spacing:.5em;color:var(--acc2)}
#logo{font-size:118px;line-height:.9;font-style:italic;letter-spacing:-.03em;margin-top:10px}
#logo span{color:var(--acc)}
#logoJp{margin-top:16px;font-size:24px;color:var(--dim);font-weight:700}
#logoFeat{margin-top:26px;font-size:18px;line-height:1.7;color:rgba(255,255,255,.82);font-weight:600}
#pressKey{position:absolute;left:80px;bottom:120px;font-size:34px;font-style:italic;animation:pk 1.1s infinite alternate}
#pressKey small{display:block;font-size:18px;margin-top:6px;font-style:normal;color:var(--dim)}
@keyframes pk{from{opacity:1}to{opacity:.45}}
#demoTag{position:absolute;right:30px;bottom:26px;font-size:14px;letter-spacing:.2em;color:var(--dim);padding:6px 10px;background:var(--panel)}
#ctrls{position:absolute;left:80px;bottom:46px;display:flex;gap:8px;font-size:15px;color:var(--dim);white-space:nowrap}
#ctrls kbd,.kb{font-family:inherit;font-weight:800;background:rgba(255,255,255,.92);color:#16181a;border-radius:4px;padding:1px 7px;font-size:14px}
/* ---- stage select ---- */
#select{display:none;pointer-events:auto;background:linear-gradient(rgba(8,9,10,.55),rgba(8,9,10,.82))}
#select h2{position:absolute;left:0;right:0;top:34px;margin:0;text-align:center;font-size:40px;font-style:italic;letter-spacing:.04em}
#select h2 small{display:block;font-size:16px;color:var(--dim);font-style:normal;letter-spacing:.2em;margin-top:6px}
#cards{position:absolute;left:calc(var(--sw,1280px)/2 - 600px);top:130px;width:1200px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.card{position:relative;height:232px;padding:14px 14px 12px;background:rgba(24,27,30,.88);border:2px solid rgba(255,255,255,.12);overflow:hidden;cursor:pointer}
.card .sw{position:absolute;left:0;right:0;top:0;height:92px}
.card .no{position:relative;font-size:46px;font-style:italic;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.card .nm{position:relative;margin-top:44px;font-size:18px;line-height:1.3}
.card .ds{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.45;font-weight:600}
.card .bt{position:absolute;left:14px;bottom:10px;font-size:13px;color:var(--acc2)}
.card .lv{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--dim);letter-spacing:.1em}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,122,26,.45);transform:translateY(-4px)}
.card.lock{filter:grayscale(1) brightness(.5);cursor:default}
.card.lock:after{content:"🔒";position:absolute;right:12px;top:10px;font-size:22px}
.card.clr .no:after{content:" ✔";font-size:22px;color:var(--ok)}
#selHint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:17px;color:var(--dim)}
#selBack{position:absolute;left:30px;top:34px;font-size:18px;padding:8px 16px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
/* ---- intro card ---- */
#intro{opacity:0;transition:opacity .5s}
#intro.on{opacity:1}
#introBox{position:absolute;left:0;bottom:118px;padding:20px 60px 22px 80px;background:linear-gradient(90deg,rgba(10,11,12,.86),rgba(10,11,12,.6) 80%,rgba(10,11,12,0));min-width:760px}
#introBox .k{font-size:18px;letter-spacing:.4em;color:var(--acc2)}
#introBox .n{font-size:56px;font-style:italic;margin-top:4px}
#introBox .d{font-size:18px;color:var(--dim);margin-top:8px;font-weight:600}
#introBox .r{font-size:17px;margin-top:10px;color:#fff}
/* ---- results ---- */
#results{display:none;background:rgba(8,9,10,.58);pointer-events:auto}
#results .panel{position:absolute;left:calc(var(--sw,1280px)/2 - 380px);top:40px;width:760px;padding:24px 34px 22px;background:rgba(18,20,22,.94);border-top:6px solid var(--acc);animation:panelin .45s both}
@keyframes panelin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
#results .hd{display:flex;align-items:baseline;justify-content:space-between}
#results h2{margin:0;font-size:46px;font-style:italic}
#results h2.ok{color:#ffe08a} #results h2.ng{color:#ff9d8f}
#results .st{font-size:16px;color:var(--dim)}
#results .row{display:flex;align-items:center;gap:12px;height:44px;margin:5px 0;padding:0 16px;background:rgba(255,255,255,.06);font-size:21px}
#results .row.me{background:rgba(255,122,26,.88)}
#results .row.q{border-left:4px solid var(--ok)}
#results .row b{width:44px;font-style:italic;font-size:24px}
#results .row .sw{width:8px;height:24px}
#results .row .nm{flex:1}
#results .row .nb{font-size:15px;color:var(--dim);width:48px}
#results .row.me .nb{color:#fff}
#results .row .tm{font-variant-numeric:tabular-nums;font-size:19px}
#results .note{text-align:center;font-size:18px;margin-top:12px;color:var(--dim)}
#results .btns{display:flex;justify-content:center;gap:14px;margin-top:14px}
.btn{font-family:inherit;font-weight:800;font-size:20px;color:#fff;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);padding:11px 26px;cursor:pointer;font-style:italic}
.btn.pri{background:var(--acc);border-color:var(--acc)}
.btn.sel{box-shadow:0 0 0 3px #fff}
/* ---- help / pause ---- */
#help{display:none;background:rgba(8,9,10,.76);pointer-events:auto}
#help .panel{position:absolute;left:calc(var(--sw,1280px)/2 - 480px);top:50px;width:960px;padding:24px 40px 22px;background:rgba(20,22,24,.96);border-top:6px solid var(--acc);font-size:20px;line-height:1.72;font-weight:600}
#help h3{margin:0 0 8px;font-size:34px;font-style:italic}
#help kbd{background:#f4f1ea;color:#16181a;border-radius:4px;padding:1px 9px;margin:0 3px;font-family:inherit;font-weight:800}
#help b{color:var(--acc2)}
#pause{display:none;background:rgba(8,9,10,.55);pointer-events:auto}
#pause .pbox{position:absolute;left:0;top:240px;width:var(--sw,1280px);text-align:center;font-size:96px;font-style:italic}
#pause small{display:block;font-size:22px;font-style:normal;color:var(--dim);margin-top:10px}
#pause .btns{display:flex;justify-content:center;gap:14px;margin-top:26px}
/* ---- fade / loading ---- */
#fade{background:#000;opacity:0;transition:opacity .35s}
#fade.on{opacity:1}
#loading{background:#0d0f11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:auto;z-index:50}
#loading .big{font-size:84px;line-height:1;font-style:italic;letter-spacing:-.03em}
#loading .big span{color:var(--acc)}
#loadmsg{font-size:20px;color:var(--dim)}
#loadbar{width:420px;height:6px;background:rgba(255,255,255,.15);overflow:hidden}
#loadbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* ---- rotate hint (portrait phones) ---- */
#rotate{display:none;position:absolute;left:0;top:0;right:0;bottom:0;z-index:99;background:#16181a;color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:26px;text-align:center;padding:20px}
#rotate b{font-size:64px;color:var(--acc)}
@media (orientation:portrait) and (max-width:900px) and (pointer:coarse){#rotate{display:flex}}
/* ---- touch ---- */
#touch{display:none;pointer-events:none}
#stage.touch.play #touch{display:block}
#stage.touch #board{display:none}
#stage.touch #speedBox{bottom:auto;top:96px;transform:scale(.62);transform-origin:right top}
#stage.touch #timer{top:18px}
.tb{position:absolute;bottom:34px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:44px;color:rgba(255,255,255,.9);pointer-events:auto;touch-action:none}
.tb.on{background:rgba(255,122,26,.55);border-color:#fff}
#tbL{left:34px} #tbR{left:206px}
#tbA{right:0;bottom:0;top:120px;width:46%;height:auto;border-radius:0;background:none;border:none;display:block}
#tbA .pedal{position:absolute;right:46px;bottom:34px;width:178px;height:178px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-style:italic;letter-spacing:.06em}
#tbA .pedal small{font-size:13px;font-style:normal;color:var(--dim);margin-top:4px;letter-spacing:0}
#tbA.on .pedal{background:rgba(255,122,26,.62);border-color:#fff}
#tbP{position:absolute;right:calc(50% - 30px);top:16px;width:60px;height:44px;font-size:20px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);pointer-events:auto}
#stage.touch #prog{top:72px}
</style>
</head>
<body>
<div id="wrap">
<div id="rotate"><b>⟳</b><div>画面を横向きにしてください<br><small>Please rotate your device</small></div></div>
<div id="stage">
  <canvas id="gl" width="1280" height="720"></canvas>
  <div class="layer" id="vig"></div>
  <div class="layer" id="flash"></div>
  <div class="layer" id="letter"></div>
  <div class="layer" id="hud">
    <div id="stageTag" class="sh"><div class="k">STAGE <span id="stNo">1</span></div><div class="n" id="stName"></div></div>
    <div id="posBox" class="sh"><div id="posLbl">POS</div><span id="posNum" class="num">6</span><span id="posOf" class="num">/6</span></div>

    <div id="msg" class="sh"></div>
    <div id="count" class="sh"></div>
    <div id="wrong" class="sh">逆走しています</div>
  </div>
  <div class="layer" id="title">
    <div id="tShade"></div>
    <div id="logoWrap" class="sh"><div id="logoSub">OFFROAD ENDURO RACING</div><div id="logo">GRIT<span>TRAIL</span></div><div id="logoJp">グリット・トレイル ― 障害物だらけの一本道を、ゴールまで。</div>
      <div id="logoFeat">全10ステージ／2位以内で次のステージへ<br>岩・丸太・川・砂・泥。よけて走るほど速い。</div></div>

  </div>
  <div class="layer" id="fade"></div>
  <div class="layer" id="loading"><div class="big">GRIT<span>TRAIL</span></div><div id="loadmsg">Loading…</div><div id="loadbar"><i></i></div></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- game code (runs once three.js is available) ----
function startGame(){
'use strict';
// ---------- 10_util.js ----------
// ===================== Utilities =====================
let W = window.__SW || 1280; const HGT = 720;   // W grows on wide screens (see fit())
const TAU = Math.PI * 2;
const GRAV = 21;       // gravity (a bit stronger than real so jumps feel snappy at game speed)
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapPi = (a) => { a %= TAU; if (a > Math.PI) a -= TAU; else if (a < -Math.PI) a += TAU; return a; };
const damp = (cur, target, k, dt) => cur + (target - cur) * (1 - Math.exp(-k * dt));
const sign = (v) => (v < 0 ? -1 : 1);

function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(20241002);          // world generation RNG (deterministic)
const frand = Math.random;               // gameplay randomness
const rr = (a, b) => a + (b - a) * frand();

// ---- value noise ----
const PERM = new Uint8Array(512);
(function () {
  const r = mulberry32(777), p = [];
  for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function hash2(ix, iz) { return PERM[(PERM[ix & 255] + iz) & 255] / 255; }
function vnoise(x, z) {

  GAME.t += dt;
  const st = GAME.state;
  if (st === 'title') {
    GAME.demoT += dt; GAME.raceT += dt; updateRace(dt);
    const lead = GAME.order && GAME.order[0];
    if (!GAME.loading && !GAME.menu && (GAME.demoT > 80 || (lead && lead.finished && GAME.demoT > 8))) enterTitle(false);
  } else if (st === 'intro') {
    GAME.introT += dt; updateRace(dt);
    if (GAME.introT > 3.4) { GAME.state = 'countdown'; GAME.countT = 3.0; showIntro(false); countdownShow(3); AU.sfx('count', 0.9); }
  } else if (st === 'countdown') {
    const a = Math.ceil(GAME.countT); GAME.countT -= dt; const b2 = Math.ceil(GAME.countT);
    if (GAME.countT <= 0) { GAME.state = 'race'; GAME.raceT = 0; countdownShow('GO!'); AU.sfx('go', 1); setTimeout(() => { if (GAME.state !== 'countdown') els.count.innerHTML = ''; }, 900); }
    else if (b2 !== a) { countdownShow(b2); AU.sfx('count', 0.9); }
    updateRace(dt);
  } else if (st === 'race') { GAME.raceT += dt; updateRace(dt); }
  else if (st === 'finish') { GAME.raceT += dt; GAME.finT += dt; updateRace(dt); if (GAME.finT > 4.2) showResults(); }
  else if (st === 'results') { GAME.resultsT += dt; GAME.raceT += dt; updateRace(dt); }
}

// ---------- audio mix ----------
const _cr = new THREE.Vector3();
function updateAudio(dt) {
  if (!AU.ctx) return;
  const cam = camera.position, tgt = CAM.target || GAME.player;
  _cr.set(1, 0, 0).applyQuaternion(camera.quaternion);
  const live = GAME.state !== 'loading' && !GAME.paused;
  for (const r of GAME.racers) {
    if (!r.engine) r.engine = AU.makeEngine();
    if (!r.engine) continue;
    const dx = r.x - cam.x, dz = r.z - cam.z, d = Math.hypot(dx, dz);
    let vol = r === tgt ? 1 : clamp(1 - d / 120, 0, 1) * 0.55;
    if (r.crash) vol *= 0.4;
    if (GAME.state === 'title') vol *= 0.55;
    const pan = d > 0.5 ? (dx * _cr.x + dz * _cr.z) / d : 0;
    const load = r.grounded && (r.surf === SURF.MUD || r.surf === SURF.SAND || r.surf === SURF.WATER) ? 1 : 0.3;
    // doppler for bikes passing the camera (the camera rides with the target bike)
    let dopp = 1;
    if (r !== tgt && d > 1) { const vr = ((r.vx - tgt.vx) * -dx + (r.vz - tgt.vz) * -dz) / d; dopp = clamp(343 / (343 - vr), 0.88, 1.12); }
    AU.updateEngine(r.engine, r.rpm, r.crash ? 0 : r.inp.thr, live ? vol : 0, r === tgt ? 0 : pan * 0.9, load, r.gear, dopp, r === tgt ? 0 : d);
  }
  // decel crackle
  // decel burble: a few pops when the throttle closes at high revs
  if (tgt) { if (tgt.inp.thr > 0) tgt.popT = 0.9; else tgt.popT = Math.max(0, (tgt.popT || 0) - dt); }
  if (live && tgt && !tgt.crash && tgt.inp.thr === 0 && tgt.rpm > 0.4 && tgt.popT > 0 && Math.random() < dt * 14) AU.sfx('pop', 0.55 * tgt.popT);
  const crowdD = Math.min(Math.abs(tgt.q.s - CR.sStart - 10), Math.abs(tgt.q.s - CR.sFin - 10));
  AU.updateLoops({ spd: tgt.crash ? 0 : Math.abs(tgt.spd), surf: tgt.surf, grounded: tgt.grounded && !tgt.crash, air: !tgt.grounded, vol: live ? (GAME.state === 'title' ? 0.5 : 1) : 0, crowd: 1 - smooth(20, 90, crowdD) });
}

// ---------- loop ----------
let lastT = 0, emaDt = 16.7, qTimer = 0, tAbs = 0;
function frameUpdate(dt) {
  tAbs += dt;
  const dtv = GAME.paused ? 0 : dt * GAME.timeScale;
  if (CR) {
    updateCamera(dt);
    for (const r of GAME.racers) { updateBikeVisual(r, dtv, tAbs); if (dtv > 0) emitForRacer(r, dtv); }
    const scale = (HGT * Q.pixelRatio) / (2 * Math.tan(camera.fov * Math.PI / 360));
    PS.dust.update(dtv, scale, WIND); PS.grit.update(dtv, scale); PS.mist.update(dtv, scale, WIND);
    updateScenery(dtv, tAbs);
    cullChunks(camera.position);
    cullInstances(camera.position, CAM.target ? CAM.target.b.root.position : null);
  }
  updateHUD(dt);
  updateAudio(dt);
}
let lastFrameWall = 0;
function frame(now) {
  requestAnimationFrame(frame);
  lastFrameWall = performance.now(); if (AU.hushed && AU.hushWhy === 'stall') AU.unhush();
  if (window.__freeze) return;
  if (!lastT) lastT = now;
  const dt = Math.min(0.05, Math.max(0.0001, (now - lastT) / 1000)); lastT = now;
  emaDt = emaDt * 0.95 + dt * 1000 * 0.05;
  qTimer += dt; if (qTimer > 4) { qTimer = 0; if (emaDt > 34 && Q.level > 0 && !GAME.loading) { Q.level--; applyQuality(); emaDt = 20; } }
  pollGamepad();
  if (!GAME.paused && !GAME.loading) {
    let rem = dt * GAME.timeScale, n = 0;
    while (rem > 1e-5 && n < 5) { const h = Math.min(rem, 1 / 60); simStep(h); rem -= h; n++; }
  }
  frameUpdate(dt);
  if (CR) renderer.render(scene, camera);
}

async function boot() {
  try { await boot2(); } catch (e) { console.error(e); const m = document.getElementById('loadmsg'); if (m) m.textContent = 'うまく起動できませんでした（WebGL が使えない可能性があります）: ' + (e && e.message ? e.message : e); }
}
async function boot2() {
  initDom(); loadSave();
  setLoad(0.08, '準備中…'); await tick();
  initGL(els.gl);
  makeTextures(); bikeMaterials(); buildSharedGeos();
  PS.dust = new Particles(2400, TEX.puff, scene); PS.grit = new Particles(2600, TEX.drop, scene); PS.mist = new Particles(500, TEX.soft, scene);
  setLoad(0.3, 'バイクを整備中…'); await tick();
  for (let i = 0; i < RIDERS.length; i++) GAME.racers.push(createRacer(i));
  GAME.player = GAME.racers[0];
  initInput();
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (coarse) Q.level = 1;
  if (window.__lowq) Q.level = 0;
  setLoad(0.5, 'コースを生成中…'); await tick();
  await enterTitle(true);
  applyQuality();
  window.addEventListener('resize', () => { applyQuality(); });
  for (let i = 0; i < 4; i++) simStep(1 / 60);
  frameUpdate(1 / 60); renderer.render(scene, camera);
  setLoad(1, 'スタート'); await tick();
  els.loading.style.transition = 'opacity .5s'; els.loading.style.opacity = 0; setTimeout(() => { els.loading.style.display = 'none'; }, 520);
  requestAnimationFrame(frame);
  // if the page stops drawing (closed, sent to the background, screen off) cut the sound right away
  setInterval(() => { if (lastFrameWall && performance.now() - lastFrameWall > 1000) AU.hush('stall'); }, 250);
  window.__g = {
    GAME, CAM, KEYS, TOUCH, camera, scene, renderer, Q, PS, AU, SAVE, STAGES,
    get CR() { return CR; }, CR_DBG, get THEME() { return THEME; },
    stepN(n) { for (let i = 0; i < n; i++) simStep(1 / 60); },
    stepDt(h, n) { for (let i = 0; i < n; i++) simStep(h); },
    shot() { frameUpdate(1 / 60); renderer.render(scene, camera); },
    fu(dt) { frameUpdate(dt || 1 / 60); },
    startStage, enterTitle, loadStage, placeRacer, respawn, crash, worldAt, frameAt, H, waterY, surfAt, openSelect, showResults, finalOrder, setupRacers, demoPlace,
  };
}
boot();

}
</script>
<script>
(function () {
  // three.js r128 is loaded by the <script> tag above (cdnjs); these mirrors are tried only if that failed
  var urls = [
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js',
    'vendor/three.min.js'
  ];
  var i = 0;
  function msg(t) { var el = document.getElementById('loadmsg'); if (el) el.textContent = t; }
  function fit() {
    var st = document.getElementById('stage'), wr = document.getElementById('wrap');
    var vw = wr.clientWidth || window.innerWidth, vh = wr.clientHeight || window.innerHeight;
    // wide phones: stretch the stage sideways (up to 21:9) instead of leaving bars
    var sw = Math.max(1280, Math.min(1680, Math.round(720 * vw / vh)));
    if (sw !== window.__SW) { window.__SW = sw; st.style.setProperty('--sw', sw + 'px'); if (window.__onStageW) window.__onStageW(sw); }
    var k = Math.min(vw / sw, vh / 720);
    st.style.transform = 'scale(' + k + ')';
    st.style.left = Math.round((vw - sw * k) / 2) + 'px';
    st.style.top = Math.round((vh - 720 * k) / 2) + 'px';
  }
  fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('wrap'));
  function boot() {
    try { startGame(); }
    catch (e) { console.error(e); msg('エラーが発生しました: ' + (e && e.message ? e.message : e)); }
  }
  function next() {
    if (i >= urls.length) { msg('three.js を読み込めませんでした。ネットワーク接続を確認して、ページを再読み込みしてください。'); return; }
    var s = document.createElement('script');
    s.src = urls[i++];
    s.onload = function () { if (window.THREE) boot(); else next(); };
    s.onerror = next;
    document.head.appendChild(s);
  }
  if (window.THREE) boot(); else next();
})();
</script>
