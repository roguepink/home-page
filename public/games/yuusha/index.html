const AU={ctx:null,on:true,
  init(){
    if(this.ctx)return;
    try{
      const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=0.6; this.master.connect(this.ctx.destination);
      this.bgm=this.ctx.createGain(); this.bgm.gain.value=0.26; this.bgm.connect(this.master);
      this.sfx=this.ctx.createGain(); this.sfx.gain.value=0.5; this.sfx.connect(this.master);
      const len=this.ctx.sampleRate; const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; this.noiseBuf=buf;
      if(SEQ.pending){const p=SEQ.pending;SEQ.pending=null;SEQ.play(p);}
    }catch(e){}
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  toggle(){ this.on=!this.on; if(this.master)this.master.gain.value=this.on?0.6:0; },
  now(){ return this.ctx?this.ctx.currentTime:0; },
  tone(o){
    if(!this.ctx)return; const c=this.ctx; const t=o.t!=null?o.t:c.currentTime;
    const osc=c.createOscillator(); osc.type=o.type||'square';
    osc.frequency.setValueAtTime(o.f,t); if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);
    const g=c.createGain(); const v=o.v!=null?o.v:0.2; const a=o.a!=null?o.a:0.005, r=o.r!=null?o.r:0.03;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a);
    g.gain.setValueAtTime(v,Math.max(t+a,t+o.d-r)); g.gain.linearRampToValueAtTime(0,t+o.d);
    osc.connect(g); g.connect(o.dest||this.sfx); osc.start(t); osc.stop(t+o.d+0.02);
  },
  noise(o){
    if(!this.ctx)return; const c=this.ctx; const t=o.t!=null?o.t:c.currentTime;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true;
    const g=c.createGain(); g.gain.setValueAtTime(o.v!=null?o.v:0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+o.d);
    let n=s; if(o.f){const fl=c.createBiquadFilter(); fl.type=o.hp?'highpass':'lowpass'; fl.frequency.value=o.f; s.connect(fl); n=fl;}
    n.connect(g); g.connect(o.dest||this.sfx); s.start(t); s.stop(t+o.d+0.02);
  }
};
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midi(name){ const m=/^([A-G])([#b]?)(\d)$/.exec(name); if(!m)return 0; return NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(parseInt(m[3])+1)*12; }
const mtof=m=>440*Math.pow(2,(m-69)/12);
function parseNotes(s){
  const out=[]; for(const tok of s.split(/\s+/)){ if(!tok||tok==='|')continue; const [n,b]=tok.split(':'); const beats=parseFloat(b||'1');
    let m=0; if(n==='r')m=0; else if(n==='x')m=-1; else if(n==='k')m=-2; else if(n==='s')m=-3; else m=midi(n);
    out.push({m,b:beats}); }
  return out;
}
const SEQ={cur:null,tracks:null,timer:null,playing:false,pending:null,
  play(name){
    const song=SONGS[name]; if(!song)return;
    if(!AU.ctx){this.pending=name;return;}
    if(this.cur===name&&this.playing)return;
    this.stop(); this.cur=name; this.playing=true; this.loop=song.loop!==false;
    this.bt=60/song.bpm; const t0=AU.ctx.currentTime+0.08;
    this.tracks=song.tracks.map(tr=>({tr,notes:parseNotes(tr.n),i:0,t:t0,done:false}));
    this.timer=setInterval(()=>this.tick(),60); this.tick();
  },
  stop(){ if(this.timer)clearInterval(this.timer); this.timer=null; this.playing=false; this.cur=null; },
  tick(){
    const c=AU.ctx; if(!c)return; const horizon=c.currentTime+0.3;
    for(const T of this.tracks){
      let guard=0;
      while(!T.done&&T.t<horizon&&guard++<64){
        const n=T.notes[T.i]; const dur=n.b*this.bt; const tr=T.tr;
        if(n.m>0){ AU.tone({f:mtof(n.m),d:dur*(tr.st||0.85),type:tr.w||'square',v:tr.v||0.15,t:T.t,dest:AU.bgm,a:0.01,r:0.04}); }
        else if(n.m===-1){ AU.noise({d:0.05,v:0.05,t:T.t,f:7000,hp:true,dest:AU.bgm}); }
        else if(n.m===-2){ AU.tone({f:150,f2:45,d:0.12,type:'triangle',v:0.35,t:T.t,dest:AU.bgm}); }
        else if(n.m===-3){ AU.noise({d:0.12,v:0.12,t:T.t,f:1800,dest:AU.bgm}); AU.tone({f:220,f2:120,d:0.08,type:'triangle',v:0.15,t:T.t,dest:AU.bgm}); }
        T.t+=dur; T.i++;
        if(T.i>=T.notes.length){ if(this.loop)T.i=0; else T.done=true; }
      }
    }
    if(this.tracks.every(T=>T.done))this.stop();
  }
};

function spr(rows,px){
  px=px||2; const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas'); c.width=w*px; c.height=h*px; const g=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i]; if(ch==='.'||!PAL[ch])continue; g.fillStyle=PAL[ch]; g.fillRect(i*px,j*px,px,px);}});
  return c;
}

function dspr(img,x,y,alpha,scale){
  if(alpha!=null)ctx.globalAlpha=alpha;
  const s=scale||1;
  ctx.drawImage(img,Math.round(x-img.width*s/2),Math.round(y-img.height*s/2),img.width*s,img.height*s);
  if(alpha!=null)ctx.globalAlpha=1;
}
function shadow(x,y,rx,ry,a){ ctx.fillStyle='rgba(0,0,0,'+(a||0.3)+')'; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,TAU); ctx.fill(); }
const glowCache={};
function glow(col,r){
  const key=col+r; if(glowCache[key])return glowCache[key];
  const c=document.createElement('canvas'); c.width=c.height=r*2; const g=c.getContext('2d');
  const gr=g.createRadialGradient(r,r,0,r,r,r); gr.addColorStop(0,col); gr.addColorStop(0.4,col); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.globalAlpha=1; g.fillStyle=gr; g.fillRect(0,0,r*2,r*2); return glowCache[key]=c;
}
function dglow(col,r,x,y,a){ ctx.globalAlpha=a==null?0.6:a; ctx.globalCompositeOperation='lighter'; ctx.drawImage(glow(col,r),x-r,y-r); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; }
function txt(s,x,y,size,col,align,shadowOn){
  ctx.font=size+'px '+FONT; ctx.textAlign=align||'left'; ctx.textBaseline='top';
  if(shadowOn){ctx.fillStyle='rgba(0,0,0,0.9)';ctx.fillText(s,x+1,y+1);ctx.fillText(s,x+2,y+2);}
  ctx.fillStyle=col||'#fff'; ctx.fillText(s,x,y);
}
function otxt(s,x,y,size,col,align){ // 縁取り文字
  ctx.font=size+'px '+FONT; ctx.textAlign=align||'left'; ctx.textBaseline='top';
  ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,10,0.95)'; ctx.lineJoin='round'; ctx.strokeText(s,x,y); ctx.fillStyle=col||'#fff'; ctx.fillText(s,x,y);
}
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function win(x,y,w,h,alpha){
  const a=alpha!=null?alpha:0.9;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
  const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,'rgba(26,28,64,'+a+')'); g.addColorStop(1,'rgba(8,8,26,'+a+')');
  ctx.fillStyle=g; rrect(x,y,w,h,5); ctx.fill(); ctx.restore();
  ctx.lineWidth=2; ctx.strokeStyle='#e2c46a'; rrect(x+1.5,y+1.5,w-3,h-3,4); ctx.stroke();
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,0.55)'; rrect(x+5.5,y+5.5,w-11,h-11,3); ctx.stroke();
  ctx.fillStyle='#f6dc8a'; for(const [cx,cy] of [[x+4,y+4],[x+w-7,y+4],[x+4,y+h-7],[x+w-7,y+h-7]])ctx.fillRect(cx,cy,3,3);
}
function bar(x,y,w,h,f,c1,c2){
  ctx.fillStyle='#0a0a18'; rrect(x,y,w,h,2); ctx.fill();
  if(f>0){ const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,c2); g.addColorStop(0.5,c1); g.addColorStop(1,c2); ctx.fillStyle=g; rrect(x+1,y+1,Math.max(1,(w-2)*f),h-2,1.5); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(x+2,y+1.5,Math.max(0,(w-2)*f-2),1); }
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; rrect(x+0.5,y+0.5,w-1,h-1,2); ctx.stroke();
}
let vignette=null;
function drawVignette(){
  if(!vignette){ vignette=document.createElement('canvas'); vignette.width=W; vignette.height=H; const g=vignette.getContext('2d');
    const gr=g.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.72); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,0.55)'); g.fillStyle=gr; g.fillRect(0,0,W,H); }
  ctx.drawImage(vignette,0,0);
}

  G={state:'play',t:0,stage:0,w:{sword:1,bow:1,boom:1},wcur:0,mageLv:1,stageT:0,phase:'intro',phaseT:0,enemies:[],pb:[],eb:[],drops:[],parts:[],texts:[],beams:[],rings:[],fx:[],msgs:[],
    head:{x:W/2,y:H-200},trail:[],mp:15,mpMax:30,weapon:0,gold:0,kills:0,spawnT:2,boss:null,bossDying:null,shake:0,flash:null,banner:null,spellBanner:null,

function mpMaxFor(i){ return i<10?30:50+5*(i-10); }  // おもて30、うらは50から1章ごとに+5
function startStage(i){
  G.stage=i; G.stageT=0; G.phase='intro'; G.phaseT=0; G.spawnT=1.5; G.boss=null;
  const dead=party.filter(m=>!m.alive);
  if(dead.length){ for(const m of dead){ m.alive=true; m.hp=m.maxHp; m.inv=2; } addMsg(dead.map(m=>m.name).join('と ')+'が いきかえった！'); SFX.revive(); ring(G.head.x,G.head.y,'#fff0a0',70,0.5); }
  if(i>=10)unlockNm();
  const nmx=mpMaxFor(i); if(nmx>G.mpMax){ G.mp=Math.min(nmx,G.mp+(nmx-G.mpMax)); G.mpMax=nmx; addMsg('MPの さいだいちが '+G.mpMax+'に あがった！'); } else if(nmx<G.mpMax){ G.mpMax=nmx; G.mp=Math.min(G.mp,nmx); }
  addMsg(stageLabel(i)+' 「'+STAGES[i].name+'」');
  if(i===10){ addMsg('まものたちが けだものの ように……'); G.flash={col:'rgba(120,0,20,0.8)',t:1.2}; }
  if(i>0&&i<ROLES.length&&!member(ROLES[i].key)){ const m=makeMember(ROLES[i]); party.push(m); addMsg(m.name+'（'+m.job+'）が なかまに くわわった！'); SFX.revive(); ring(G.head.x,G.head.y,'#fff0a0',60); G.joined={name:m.name,job:m.job,t:3}; }
  else if(i!==10)addMsg(NM()?'ちの においが する……':'まものの けはいが する…');
  if(i>0)saveGame();
  SEQ.play(STAGES[i].song);
}

function topIconHit(p){ const ip=iconPos(); if(p.x<ip.x-4||p.x>ip.x+92||p.y<ip.y-6||p.y>ip.y+28)return null; return p.x>ip.x+46?'audio':'fs'; }
function onPress(code){
  wake();
  if(code==='KeyM'){AU.toggle();return;}
  if(code==='KeyF'){toggleFS();return;}
  if(!G||G.state==='title'){
    const n=titleOpts().length;
    if(code==='ArrowUp'||code==='KeyW'){ if(n>1){titleSel=(titleSel+n-1)%n;SFX.cursor();} return; }
    if(code==='ArrowDown'||code==='KeyS'){ if(n>1){titleSel=(titleSel+1)%n;SFX.cursor();} return; }
    if(['KeyZ','Enter','Space','KeyX'].includes(code))startGame(titleOpts()[Math.min(titleSel,n-1)].k); return; }
  if(G.paused){ if(['KeyZ','Enter','Space','KeyP'].includes(code)){G.paused=false;SFX.ok();} else if(code==='KeyX'||code==='Escape'){G=null;toTitle();} return; }
  if(code==='KeyP'&&G.state==='play'){G.paused=true;return;}
  if((code==='KeyC'||code==='Tab')&&G.state==='play'&&!G.menu.open&&!G.dead){switchWeapon();return;}
  if(G.state==='over'||G.state==='clear'){ if((G.state==='over'?G.overT:G.clearT)>1.5&&['KeyZ','Enter','Space','KeyX'].includes(code)){G=null;toTitle();} return; }
  if(G.state!=='play')return;
  if(G.menu.open){
    if(code==='ArrowUp'||code==='KeyW'){G.menu.sel=(G.menu.sel+SPELLS.length-1)%SPELLS.length;SFX.cursor();}
    else if(code==='ArrowDown'||code==='KeyS'){G.menu.sel=(G.menu.sel+1)%SPELLS.length;SFX.cursor();}
    else if(['KeyZ','Enter','Space'].includes(code))castSelected();
    else if(code==='KeyX'||code==='Escape'){closeMenu();}
  }else{
    if(['KeyX','Enter','Space','KeyZ'].includes(code))openMenu();
  }
}
function canvasPos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/VS,y:(e.clientY-r.top)/VS}; }
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); wake(); const p=canvasPos(e);
  const ic=topIconHit(p); if(ic==='audio'){AU.toggle();return;} if(ic==='fs'){toggleFS();return;}
  if(!G||G.state==='title'){ const o=titleOpts(); if(o.length>1){ const r=Math.floor((p.y-TITLE_Y0+6)/TITLE_DY); if(r>=0&&r<o.length)titleSel=r; } startGame(o[Math.min(titleSel,o.length-1)].k); return; }
  if(G.paused){ if(p.y>H/2+16&&p.y<H/2+46){G=null;toTitle();} else if(p.y>H/2-24&&p.y<H/2+12){G.paused=false;SFX.ok();} return; }

});

function startGame(kind){ kind=kind||'new'; if(kind==='cont'&&!loadSave())kind='new'; newGame(kind==='cont'?loadSave():kind==='nm'?{nmStart:true}:null); if(kind==='new')clearSave(); SFX.ok(); armHistory(); }
function openMenu(){ if(G.dead||G.phase==='clear')return; G.menu.open=true; SFX.ok(); }

function menuRowAt(p){ const x0=36,y0=200,w=W-72; if(p.x<x0||p.x>x0+w)return -1; for(let i=0;i<SPELLS.length;i++){const y=y0+46+i*30; if(p.y>=y-4&&p.y<y+26)return i;} return -1; }
function member(key){ return party.find(m=>m.key===key); }
function castSelected(){
  const sp=SPELLS[G.menu.sel]; const caster=member(sp.need);
  if(!caster){ const r=ROLES.find(x=>x.key===sp.need); addMsg(r.job+'は まだ なかまに いない！'); SFX.cancel(); return; }
  if(!caster.alive){ addMsg(caster.name+'は たおれている！'); SFX.cancel(); return; }
  if(G.mp<sp.mp){ addMsg('MPが たりない！'); SFX.cancel(); return; }
  G.mp-=sp.mp; G.menu.open=false; SFX.spell();
  addMsg(caster.name+'は '+sp.n+'を となえた！');
  G.spellBanner={n:sp.n,col:sp.col,t:1.3};
  burst(caster.x,caster.y,sp.col,16,100); ring(caster.x,caster.y,sp.col,70,0.5); fx({k:'cast',x:caster.x,y:caster.y,col:sp.col,life:0.6});
  const hx=caster.x,hy=caster.y;
  switch(sp.n){
    case 'フレア':{
      const tg=nearestEnemy(hx,hy,true);
      for(let i=0;i<3;i++){const a=-Math.PI/2+(i-1)*0.55; G.pb.push({x:hx,y:hy-10,vx:Math.cos(a)*110,vy:Math.sin(a)*110,r:11,dmg:16,kind:'fire',home:3.5,tg,col:'#ff9a30',life:5});}
      break;}
    case 'ブレイズ': G.beams.push({y:hy-10,h:40,life:2.4,hit:new Set()}); SFX.wave(); G.flash={col:'rgba(255,140,40,0.35)',t:0.3}; break;
    case 'フロスト':
      SFX.freeze(); G.flash={col:'rgba(140,220,255,0.7)',t:0.45}; G.shake=5; ring(hx,hy,'#a0f0ff',300,0.6);
      for(const e of G.enemies){ if(e.entering)continue; e.frozen=e.boss?2.5:4.5; damageEnemy(e,8,false,'#78e4ff'); fx({k:'ice',x:e.x,y:e.y,r:e.r,life:0.7}); }
      for(let i=0;i<40;i++)G.parts.push({x:rnd(0,W),y:rnd(0,H),vx:rnd(-10,10),vy:rnd(30,70),life:rnd(0.8,1.6),col:'#d8f8ff',sz:rnd(2,4)});
      G.eb.length=0; addMsg('てきは こおりついた！'); break;
    case 'ヒーリア': SFX.heal(); G.flash={col:'rgba(120,255,160,0.3)',t:0.35};
      for(const m of party)if(m.alive){ m.hp=m.maxHp; fx({k:'heal',x:m.x,y:m.y,life:1.0}); for(let i=0;i<10;i++)G.parts.push({x:m.x+rnd(-14,14),y:m.y+rnd(-10,20),vx:0,vy:rnd(-90,-40),life:rnd(0.5,1),col:pick(['#a0ffa0','#ffffff','#d0ffd0']),sz:3}); }
      addMsg('なかまの きずが すべて なおった！'); break;
    case 'リザレク':{ const dead=party.filter(m=>!m.alive); if(!dead.length){ addMsg('…しかし だれも たおれていない'); break; }
      SFX.revive(); G.flash={col:'rgba(255,240,180,0.45)',t:0.4};
      for(const m of dead){ m.alive=true; m.hp=Math.ceil(m.maxHp*0.6); m.inv=1.5; fx({k:'heal',x:m.x,y:m.y,life:1.0}); ring(m.x,m.y,'#fff0a0',50); burst(m.x,m.y,'#ffffa0',16,100); addMsg(m.name+'は いきかえった！'); }
      break; }
    case 'エクスプロ':

// ---------------------------------------------------------------- Spawning
function spawnEnemy(type,x,y,p){
  const def=typeof type==='string'?ENEMY[type]:type; const mul=def.boss?1.45*(L()>=10?1.7:1.2):1.2*(1+0.32*Math.min(L(),9))*(L()>=10?1.25+0.07*(L()-10):1);
  const e={type:def.key||type,def,x,y,hp:Math.ceil(def.hp*mul),maxHp:Math.ceil(def.hp*mul),r:def.r,t:0,p:p||{},flash:0,frozen:0,shootT:rnd(0.5,1.5),phase:0,entering:!!def.boss,boss:!!def.boss,alpha:1,vx:0,vy:0};
  G.enemies.push(e); return e;
}
function spawnWave(){
  const st=STAGES[G.stage]; const tot=st.pool.reduce((a,b)=>a+b[1],0); let r=Math.random()*tot, type='purun';
  for(const [tp,wt] of st.pool){ r-=wt; if(r<=0){type=tp;break;} }
  const extra=L()>=4?1:0;
  switch(type){
    case 'purun':{
      const n=ri(3,5)+extra, form=Math.random()<0.5?'line':'v'; const cx=rnd(60,W-60), gap=36;
      for(let i=0;i<n;i++){const x=clamp(cx+(i-(n-1)/2)*gap,20,W-20); const y=-20-(form==='v'?Math.abs(i-(n-1)/2)*26:0); spawnEnemy('purun',x,y,{ph:rnd(0,6)});}
      break;}
    case 'basakey':{
      const n=ri(3,5)+extra, side=Math.random()<0.5?-1:1, y0=rnd(80,230);
      for(let i=0;i<n;i++)spawnEnemy('basakey',side<0?-20-i*36:W+20+i*36,y0,{dir:-side,y0});
      break;}
    case 'yurei':{
      const n=ri(2,3)+extra, x=rnd(40,W-40);
      for(let i=0;i<n;i++)spawnEnemy('yurei',clamp(x+rnd(-40,40),30,W-30),-20-i*50,{stopY:rnd(130,270)});
      break;}
    case 'kozuchi':{
      const n=(Math.random()<0.4?2:1)+(L()>=6?1:0), x=rnd(50,W-50);
      for(let i=0;i<n;i++)spawnEnemy('kozuchi',clamp(x+i*60-30*(n-1),30,W-30),-24-i*30);
      break;}
    case 'hanetori':{
      const n=ri(2,3)+extra, side=Math.random()<0.5?-1:1, y0=rnd(90,210);
      for(let i=0;i<n;i++)spawnEnemy('hanetori',side<0?-24-i*60:W+24+i*60,y0+i*20,{dir:-side,y0:y0+i*20});
      break;}
  }
  if(G.t-G.lastKillMsg>2.5){ addMsg(ename(ENEMY[type])+'の むれが あらわれた！'); G.lastKillMsg=G.t; }
}
function awaken(def){
  return Object.assign({},def,{name:def.name+'・かくせい',sub:'しんの ちからを かいほうした',hp:Math.ceil(def.hp*1.6),scale:def.scale*1.2,r:def.r*1.2,ty:def.ty+12,sc:Math.ceil(def.sc*1.5),stage2:true,
    filter:(def.pattern==='maou'?'saturate(1.6) brightness(1.15)':'hue-rotate(200deg) saturate(1.5) contrast(1.15)')+(def.nightmare?' '+NMFILTER:'')});
}
function spawnBoss(def){
  def=def||bossDefFor(G.stage); const b=spawnEnemy(def,W/2,-120); b.targetY=def.ty; G.boss=b; if(def.stage2)b.spd=1.15;
  addMsg(def.name+'が あらわれた！'); SFX.roar(); G.shake=def.stage2?16:10; G.banner={t:3,name:def.name,sub:def.sub};
  if(def.stage2){ G.flash={col:'rgba(200,0,40,0.55)',t:0.6}; ring(W/2,def.ty,'#ff4060',240,0.7); }
  else SEQ.play(def.pattern==='maou'||def.nightmare?'last':'boss');
}
function nearestEnemy(x,y,preferBoss){
  let best=null,bd=1e9;
  for(const e of G.enemies){ if(e.entering||e.y<-10)continue; let d=hyp(e.x-x,e.y-y); if(preferBoss&&e.boss)d*=0.3; if(d<bd){bd=d;best=e;} }
  return best;
}

// ---------------------------------------------------------------- Update
function update(dt){
  if(!G){ titleT+=dt; return; }
  if(G.paused)return;
  const slow=G.menu.open?0.08:1; const d=dt*slow;
  G.t+=d; G.bgY+=70*d;
  if(G.shake>0)G.shake=Math.max(0,G.shake-40*dt);
  if(G.flash){G.flash.t-=dt;if(G.flash.t<=0)G.flash=null;}
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(G.spellBanner){G.spellBanner.t-=dt;if(G.spellBanner.t<=0)G.spellBanner=null;}
  if(G.joined){G.joined.t-=dt;if(G.joined.t<=0)G.joined=null;}
  if(G.nmIntro!=null){G.nmIntro-=dt;if(G.nmIntro<=0)G.nmIntro=null;}
  updateParty(d);
  updateStage(d);
  updateEnemies(d);
  updateBullets(d);
  updateDrops(d);
  updateFx(d);
  if(G.state==='play')collisions();
  if(G.state==='over')G.overT+=dt;

function collisions(){
  for(const b of G.pb.slice()){
    for(const e of G.enemies){ if(e.entering)continue;
      if(hyp(e.x-b.x,e.y-b.y)<e.r+b.r){
        if(b.kind==='fire'){ explodeFire(b); G.pb.splice(G.pb.indexOf(b),1); break; }
        if(b.hit){ if(b.hit.has(e))continue; b.hit.add(e); }
        damageEnemy(e,b.dmg,(b.kind==='sword'||b.kind==='boom')&&Math.random()<0.1,b.kind==='boom'?'#ffc080':null); SFX.hit(); burst(b.x,b.y,b.col,b.kind==='boom'?8:3,b.kind==='boom'?110:60);

        if(b.kind==='arrow'){ b.pierce--; if(b.pierce>0)continue; }
        G.pb.splice(G.pb.indexOf(b),1); break; } }
  }
  const cd=5+(L()>=5?1:0)+(L()>=8?1:0);

}

  const lines=['いどう： ほうこうキー / WASD / ドラッグ','じゅもん： X / ボタン   ぶき： C / ボタン','こうげきは オートで おこなわれる','しょうを すすむごとに なかまが ふえる','なかまが たおれると ひつぎになる','C： ぶき きりかえ  M： おと  P： ポーズ'];
  lines.forEach((s,i)=>txt(s,36,308+i*27,12,i===3||i===4?'#c8d8ff':'#fff'));
  const o=titleOpts();
  if(o.length>1){ const bl=Math.floor(titleT*3)%2===0; ctx.font='14px '+FONT;
    o.forEach((op,i)=>{ const y=TITLE_Y0+i*TITLE_DY, sel=i===titleSel; const col=op.k==='nm'?(sel?'#ff7070':'#a06070'):op.k==='cont'?(sel?'#ffe9a0':'#9898b0'):(sel?'#fff':'#9898b0');
      otxt(op.label,W/2,y,14,col,'center'); if(sel&&bl){ const w=ctx.measureText(op.label).width; otxt('▶',W/2-w/2-14,y,14,op.k==='nm'?'#ff5050':'#fff','center'); } }); }
  else if(Math.floor(titleT*2)%2===0)otxt('▶ Z / Enter / タップ で はじめる',W/2,522,14,'#fff','center');
  txt('さいこうきろく： '+best+'G',W/2,582,12,'#ffe060','center',true);
  txt('♪ BGM・こうかおんは すべて オリジナル',W/2,606,10,'#b0b0c8','center',true);
  drawTopIcons();
}
function drawEnd(){
  const over=G.state==='over'; const t=over?G.overT:G.clearT; if(t<0.8)return;
  ctx.fillStyle='rgba(0,0,0,'+clamp((t-0.8)*0.8,0,0.65)+')'; ctx.fillRect(0,0,W,H);
  win(24,186,W-48,250);
  if(over){ txt('おうさま',40,202,12,'#ffe060'); txt('「ゆうしゃ アレンよ…',40,226,13); txt('  そなたの たびは ここで おわりか。',40,247,13); txt('  だが きぼうは まだ きえておらぬ。',40,268,13); txt('  もういちど たちあがるのだ！」',40,289,13); }
  else { dglow('#ffd060',90,W/2,236,0.3); otxt('しんのまおうを たおした！',W/2,208,16,'#ffe060','center'); txt('うらのせかいも しずまり',W/2,240,14,'#fff','center'); txt('ほんとうの へいわが おとずれた……',W/2,268,12,'#c8d8ff','center'); }
  ctx.fillStyle='rgba(226,196,106,0.5)'; ctx.fillRect(40,316,W-80,1);
  txt('とうたつ： '+stageLabel(G.stage)+' 「'+STAGES[G.stage].name+'」',40,328,12,'#c8d8ff');
  txt('こんかいの せいか： '+G.gold+'G',40,350,13,'#fff'); txt('たおした まもの： '+G.kills,40,372,13,'#fff');
  if(G.gold>=best&&G.gold>0)txt('★ さいこうきろく こうしん！',40,394,13,'#ffe060');
  if(t>1.5&&Math.floor(t*2)%2===0)txt('▶ Z / タップ で タイトルへ',W/2,414,13,'#fff','center');
}
function draw(){
  ctx.save();
  if(!G){ drawTitle(); ctx.restore(); return; }
  if(G.shake>0)ctx.translate(rnd(-G.shake,G.shake)*0.5,rnd(-G.shake,G.shake)*0.5);
  drawBg(THEMES[STAGES[G.stage].theme],G.bgY,G.t);
  if(NM())drawNightmare(G.bgY,G.t);
  drawDrops(); drawEnemies(); drawParty(); drawBullets(); drawSpellFx(); drawFx();
  drawVignette();
  if(G.flash){ ctx.fillStyle=G.flash.col; ctx.globalAlpha=clamp(G.flash.t*2,0,1); ctx.fillRect(-20,-20,W+40,H+40); ctx.globalAlpha=1; }
  ctx.restore();
  if(G.phase==='intro'&&G.phaseT<2.2){ const a=G.phaseT<0.3?G.phaseT/0.3:G.phaseT>1.8?(2.2-G.phaseT)/0.4:1; ctx.globalAlpha=a; win(40,H/2-44,W-80,66,0.85); txt(stageLabel(G.stage),W/2,H/2-32,12,NM()?'#ff6060':'#ffe060','center'); otxt(STAGES[G.stage].name,W/2,H/2-12,20,NM()?'#ffb0b0':'#fff','center'); ctx.globalAlpha=1; }
  if(G.nmIntro!=null)drawNmIntro();
  if(G.joined)drawJoined();
  if(G.banner)drawBanner();
  if(G.spellBanner)drawSpellBanner();
  drawHud();
  if(G.menu.open)drawMenu();
  if(G.state==='over'||G.state==='clear')drawEnd();
}

// ---------------------------------------------------------------- Loop
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  try{ update(dt); draw(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);
</script>
